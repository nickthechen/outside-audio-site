      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

<div style=\"width: 34px; height: 2px; background: #8FE8A8;\"><\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .32em; color: #8FE8A8;\">SEVEN PLUGINS · ONE FIELD GUIDE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 74px; font-weight: 700; line-height: .98; letter-spacing: -.015em; max-width: 900px; text-wrap: balance;\">Grown in the dirt,<br><span style=\"color: #8FE8A8;\">wired for sound.<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size: 17px; line-height: 1.6; color: #B9C2AC; max-width: 600px; margin-top: 22px;\">Chord shaping, video chopping, harmonic splitting, pocket-tick drums, spectral sculpting, granular grids and polyrhythmic rolling. Seven field instruments — two free on Splice, five in the $10 bundle.<\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; margin-top: 30px;\">\n        <a href=\"#chordshaper\" style=\"height: 46px; padding: 0 26px; border-radius: 4px; background: #8FE8A8; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #1E2519;\">MEET THE PLUGINS<\u002Fa>\n        <a href=\"#downloads\" style=\"height: 46px; padding: 0 26px; border-radius: 4px; border: 1.5px solid #4E6B3C; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #EDF1E6;\">GET THEM<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; border-top: 1px solid rgba(143,232,168,.25); border-bottom: 1px solid rgba(143,232,168,.25); background: rgba(14,20,14,.55); overflow: hidden; padding: 10px 0;\">\n      <div style=\"display: flex; gap: 60px; width: max-content; animation: scMarquee 40s linear infinite; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .3em; color: #5FA877; white-space: nowrap;\">\n        <sc-for list=\"{{ marquee }}\" as=\"m\" hint-placeholder-count=\"16\"><span>{{ m.t }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"7\">\n    <div id=\"{{ sec.id }}\" style=\"position: relative; overflow: hidden; background: {{ sec.bg }};\">\n      <svg style=\"position: absolute; inset: 0; width: 100%; height: 100%; opacity: {{ sec.patOp }}; animation: scDrift 50s linear infinite;\" sc-camel-preserve-aspect-ratio=\"none\">\n        <defs>\n          <pattern id=\"leaf-{{ sec.id }}\" width=\"84\" height=\"84\" sc-camel-pattern-units=\"userSpaceOnUse\">\n            <path d=\"M42 8 C 58 22 58 44 42 60 C 26 44 26 22 42 8 Z\" fill=\"none\" stroke=\"{{ sec.patC }}\" stroke-width=\"1.1\"><\u002Fpath>\n            <path d=\"M42 12 V56\" stroke=\"{{ sec.patC }}\" stroke-width=\"0.8\"><\u002Fpath>\n            <path d=\"M0 76 C 10 66 20 66 30 76 C 20 86 10 86 0 76 Z\" fill=\"none\" stroke=\"{{ sec.patC }}\" stroke-width=\"1\"><\u002Fpath>\n          <\u002Fpattern>\n          <pattern id=\"hex-{{ sec.id }}\" width=\"56\" height=\"97\" sc-camel-pattern-units=\"userSpaceOnUse\">\n            <path d=\"M28 0 L56 16.2 V48.5 L28 64.7 L0 48.5 V16.2 Z M28 64.7 L56 80.8 V97 M28 64.7 L0 80.8 V97\" fill=\"none\" stroke=\"{{ sec.patC }}\" stroke-width=\"1\"><\u002Fpath>\n          <\u002Fpattern>\n        <\u002Fdefs>\n        <rect width=\"100%\" height=\"100%\" fill=\"url(#{{ sec.pat }}-{{ sec.id }})\"><\u002Frect>\n      <\u002Fsvg>\n      <div style=\"position: absolute; inset: 0; background: linear-gradient({{ sec.plate }});\"><\u002Fdiv>\n      <div style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 84px 40px 90px;\">\n        <div style=\"display: flex; align-items: flex-end; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 500; color: {{ sec.accent }}; line-height: 1;\">{{ sec.num }}<\u002Fdiv>\n          <div style=\"font-size: 44px; font-weight: 700; line-height: 1;\">{{ sec.name }}<\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .22em; color: {{ sec.accent }}; padding-bottom: 6px;\">{{ sec.tag }}<\u002Fdiv>\n          <div style=\"flex: 1;\"><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; padding-bottom: 6px;\">\n            <div style=\"height: 20px; padding: 0 9px; border-radius: 3px; background: {{ sec.tierBg }}; box-shadow: inset 0 0 0 1px {{ sec.tierBd }}; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: .16em; color: {{ sec.tierC }};\">{{ sec.tier }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7C8873;\">{{ sec.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 17px; line-height: 1.6; color: #C4CDB9; max-width: 760px; margin-top: 18px;\">{{ sec.blurb }}<\u002Fdiv>\n\n        <div style=\"margin-top: 34px; position: relative;\">\n          <div style=\"position: absolute; inset: -12px; border: 1.5px solid {{ sec.accent }}; border-radius: 16px; opacity: .3;\"><\u002Fdiv>\n          <div style=\"border-radius: 10px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6); position: relative; width: 1160px;\">\n            <div style=\"width: {{ sec.uw }}; height: {{ sec.uh }}; transform: scale({{ sec.scale }}); transform-origin: top left; margin-bottom: {{ sec.mb }}; margin-right: {{ sec.mr }};\">\n              <sc-if value=\"{{ sec.isChord }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"ChordShaperUnit\" hint-size=\"1140px,990px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isVideo }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"VideoSamplerUnit\" hint-size=\"1120px,872px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isHfx }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"HarmonicFXUnit\" hint-size=\"1120px,940px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isPocket }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"PocketSequencerUnit\" hint-size=\"1120px,872px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isSculpt }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"SoundSculptUnit\" hint-size=\"1240px,780px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isGrain }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"GrainGridUnit\" hint-size=\"1128px,888px\"><\u002Fdc-import><\u002Fsc-if>\n              <sc-if value=\"{{ sec.isRoly }}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"RolyPolyUnit\" hint-size=\"900px,734px\"><\u002Fdc-import><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 44px; align-items: stretch;\">\n          <sc-if value=\"{{ sec.isChord }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #8FE8A8;\">DRAW A BOX, GET A CHORD<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C8873;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 140px; background: #0D0C07; border: 3px solid #2A2718; border-radius: 8px; position: relative; overflow: hidden;\">\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(163,177,132,.08) 27px 28px), repeating-linear-gradient(to right, transparent 0 24%, rgba(163,177,132,.1) 24% calc(24% + 1px));\"><\u002Fdiv>\n                <sc-for list=\"{{ chordBlocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <div style=\"position: absolute; left: {{ b.x }}; top: {{ b.y }}; width: 22%; height: {{ b.h }}; border: 1.5px solid {{ b.c }}; background: {{ b.bg }}; border-radius: 3px; box-shadow: 0 0 12px {{ b.bg }}; padding: 4px 7px; box-sizing: border-box;\">\n                    <div style=\"display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: {{ b.c }};\"><span>{{ b.n }}<\u002Fspan><span style=\"font-size: 7px; letter-spacing: .12em; color: #ECE5D2; opacity: .8;\">{{ b.s }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; gap: 2px; align-items: flex-end; height: 16px; margin-top: 4px;\">\n                      <sc-for list=\"{{ b.notes }}\" as=\"n\" hint-placeholder-count=\"8\"><div style=\"width: 4px; height: 16px; background: {{ b.c }}; transform-origin: bottom; animation: scStrum 1.6s ease-in-out infinite; animation-delay: {{ n.d }};\"><\u002Fdiv><\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"position: absolute; top: 0; bottom: 0; width: 2px; background: #DE8A34; box-shadow: 0 0 8px rgba(222,138,52,.8); animation: scPlay 6.4s linear infinite;\"><\u002Fdiv>\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #7C8873; margin-top: 10px;\">Left to right is time, up and down is pitch in scale steps. Drag a box on empty space and it becomes a chord — top edge sets extensions, bottom edge sets the bass. Hold a block for the performance wheel: HOLD, STRUM, ARP, TRESILLO, RAGTIME, PULSE, BROKEN.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #FFB25A;\">THE SLICE DECK<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C8873;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 140px; background: #120D07; border: 3px solid #17181A; border-radius: 6px; position: relative; overflow: hidden;\">\n                <svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 700 134\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0;\"><path d=\"{{ vsWave }}\" fill=\"rgba(255,178,90,.42)\" stroke=\"#FFB25A\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg>\n                <sc-for list=\"{{ vsChops }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <div style=\"position: absolute; left: {{ c.x }}; top: 0; bottom: 0; width: 2px; background: {{ c.c }}; box-shadow: 0 0 6px {{ c.c }};\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: {{ c.x }}; top: 6px; margin-left: 4px; height: 15px; padding: 0 5px; background: {{ c.c }}; border-radius: 2px; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; color: #1A1408;\">{{ c.n }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"position: absolute; top: 0; bottom: 0; width: 2px; background: #F5EFE4; box-shadow: 0 0 8px rgba(245,239,228,.8); animation: scPlay 7s linear infinite;\"><\u002Fdiv>\n                <div style=\"position: absolute; left: 10px; bottom: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: .12em; color: #C07E38;\">ENTER DROPS A CHOP · 1-0 PLAYS IT · PICTURE FOLLOWS THE TAPE<\u002Fdiv>\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #7C8873; margin-top: 10px;\">Drop a video in and slice it like a record. Every chop has its own ADSR, transpose, pan and warp — pitch a chop up and the picture plays faster, exactly like tape. Pop the picture out to a second display and perform it fullscreen.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isHfx }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #4A3C26; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #D8C878;\">THE EVEN / ODD SPLIT<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #8A7C5E;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 12px; align-items: stretch; height: 140px;\">\n                <sc-for list=\"{{ vuMinis }}\" as=\"v\" hint-placeholder-count=\"2\">\n                  <div style=\"width: 150px; border-radius: 6px; background: linear-gradient(180deg, #F0EAD8, #DFD8C4); border: 2px solid #0F0C07; position: relative; overflow: hidden;\">\n                    <svg width=\"150\" height=\"100\" sc-camel-view-box=\"0 0 150 100\" style=\"position: absolute; top: 8px;\"><path d=\"M 24 90 A 60 60 0 0 1 126 90\" fill=\"none\" stroke=\"#584E3A\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n                    <div style=\"position: absolute; left: 50%; bottom: 10px; width: 3px; height: 74px; margin-left: -1.5px; background: {{ v.c }}; border-radius: 2px; transform-origin: 50% 100%; animation: {{ v.anim }} 3.4s ease-in-out infinite;\"><\u002Fdiv>\n                    <div style=\"position: absolute; left: 9px; bottom: 6px; font-size: 9px; font-weight: 700; letter-spacing: .2em; color: {{ v.lc }};\">{{ v.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"flex: 1; background: #12100A; border: 2px solid #0F0C07; border-radius: 6px; position: relative; overflow: hidden;\">\n                  <div style=\"position: absolute; left: 8px; top: 6px; display: flex; gap: 10px; font-size: 8px; font-weight: 700; letter-spacing: .14em; z-index: 2;\"><span style=\"color: #6FBF8A;\">● EVEN<\u002Fspan><span style=\"color: #E08A3C;\">● ODD<\u002Fspan><\u002Fdiv>\n                  <div style=\"position: absolute; left: 0; right: 0; top: 50%; height: 80px; margin-top: -40px; overflow: hidden;\">\n                    <svg width=\"700\" height=\"80\" sc-camel-view-box=\"0 0 700 50\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; animation: scWave 6s linear infinite;\">\n                      <path d=\"{{ splitE }}\" fill=\"rgba(111,191,138,.55)\" stroke=\"#6FBF8A\" stroke-width=\"1\"><\u002Fpath>\n                      <path d=\"{{ splitO }}\" fill=\"rgba(224,138,60,.5)\" stroke=\"#E08A3C\" stroke-width=\"1\"><\u002Fpath>\n                    <\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #8A7C5E; margin-top: 10px;\">Evens carry warmth, odds carry edge. Tremolo only the odds; convolve only the evens. The VU pair shows each side breathing on its own.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isPocket }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #8FE8A8;\">POCKET TICKS<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C8873;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 140px; background: #0E140E; border: 3px solid #3E4636; border-radius: 8px; position: relative; overflow: hidden; padding: 14px 18px; box-sizing: border-box;\">\n                <div style=\"display: flex; gap: 5px; margin-bottom: 14px;\">\n                  <div style=\"height: 16px; padding: 0 10px; border: 1px solid #3E6B4C; border-radius: 2px; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: .14em; color: #5FA877;\">PATTERN<\u002Fdiv>\n                  <div style=\"height: 16px; padding: 0 10px; border: 1px solid #3E6B4C; border-radius: 2px; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: .14em; color: #5FA877;\">TRIPLET<\u002Fdiv>\n                  <div style=\"height: 16px; padding: 0 10px; border: 1.5px solid #8FE8A8; border-radius: 2px; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: .14em; color: #8FE8A8; background: rgba(143,232,168,.1);\">GROOVE<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position: relative; height: 60px;\">\n                  <div style=\"position: absolute; left: 0; right: 0; top: 46px; height: 1px; background: #243024;\"><\u002Fdiv>\n                  <div style=\"position: absolute; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #8FE8A8, rgba(143,232,168,.2)); box-shadow: 0 0 8px rgba(143,232,168,.7); animation: scPlay 5s linear infinite;\"><\u002Fdiv>\n                  <sc-for list=\"{{ pocketTicks }}\" as=\"t\" hint-placeholder-count=\"16\">\n                    <div style=\"position: absolute; left: {{ t.x }}; top: {{ t.top }}; width: 2.5px; height: {{ t.h }}; background: {{ t.c }}; box-shadow: {{ t.glow }}; animation: {{ t.anim }};\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); pointer-events: none;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #7C8873; margin-top: 10px;\">Every step rides a tick you can push ahead or drag behind the beat. The orange one is living in the pocket — that lean is the whole idea. Groove capture writes your own timing into the ticks.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isSculpt }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #FFB25A;\">SCULPT THE SPECTROGRAM<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C8873;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 140px; background: #120D07; border: 3px solid #17181A; border-radius: 6px; position: relative; overflow: hidden;\">\n                <div style=\"position: absolute; inset: 0; display: grid; grid-template-columns: repeat(40, 1fr); grid-template-rows: repeat(14, 1fr); gap: 1px;\">\n                  <sc-for list=\"{{ ssCells }}\" as=\"c\" hint-placeholder-count=\"560\"><div style=\"background: {{ c.c }};\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"position: absolute; width: 54px; height: 54px; margin: -27px; border-radius: 50%; border: 1.5px solid #E0763A; background: rgba(224,118,58,.14); box-shadow: 0 0 16px rgba(224,118,58,.5); animation: scBrush 7s ease-in-out infinite;\"><\u002Fdiv>\n                <div style=\"position: absolute; left: 10px; top: 6px; display: flex; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: .12em;\"><span style=\"color: #8FE8A8;\">L1<\u002Fspan><span style=\"color: #FFB25A;\">L2<\u002Fspan><span style=\"color: #7EB7FF;\">L3<\u002Fspan><span style=\"color: #E07EDC;\">L4<\u002Fspan><span style=\"color: #E0763A; margin-left: 8px;\">PUSH<\u002Fspan><\u002Fdiv>\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #7C8873; margin-top: 10px;\">Four samples, one 4096-point spectrogram, tinted by the layer that owns each cell. Paint collage brushes to reveal one layer inside another, then sculpt with PUSH, PULL, SMEAR, GRATE, RIPPLE, FREEZE — 18 transforms that change the sound itself, re-rendered in the background.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isGrain }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #BC8CEC;\">THE GRID<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #7C8873;\">AS IN THE PLUGIN<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 140px; background: #14101C; border: 3px solid #452E22; border-radius: 8px; position: relative; overflow: hidden;\">\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to right, transparent 0 calc(6.25% - 1px), rgba(188,140,236,.14) calc(6.25% - 1px) 6.25%), repeating-linear-gradient(to bottom, transparent 0 33px, rgba(188,140,236,.14) 33px 34px);\"><\u002Fdiv>\n                <sc-for list=\"{{ ggClips }}\" as=\"c\" hint-placeholder-count=\"8\">\n                  <div style=\"position: absolute; left: {{ c.x }}; top: {{ c.y }}; width: {{ c.w }}; height: 30px; border-radius: 3px; background: rgba(188,140,236,.18); border: 1.5px solid #BC8CEC; box-shadow: 0 0 10px rgba(188,140,236,.4); overflow: hidden;\"><svg width=\"100%\" height=\"30\" sc-camel-view-box=\"0 0 120 30\" sc-camel-preserve-aspect-ratio=\"none\"><path d=\"{{ c.p }}\" fill=\"none\" stroke=\"#BC8CEC\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ ggGrains }}\" as=\"g\" hint-placeholder-count=\"12\"><div style=\"position: absolute; left: {{ g.x }}; top: {{ g.y }}; width: 5px; height: 5px; border-radius: 50%; background: #F5C56A; box-shadow: 0 0 6px #F5C56A; animation: scGrain {{ g.d }} ease-in-out infinite;\"><\u002Fdiv><\u002Fsc-for>\n                <div style=\"position: absolute; top: 0; bottom: 0; width: 2px; background: #F7F3FB; box-shadow: 0 0 8px rgba(247,243,251,.9); animation: scPlay 8s linear infinite;\"><\u002Fdiv>\n                <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; color: #7C8873; margin-top: 10px;\">Audio types itself across the capture strip; drag a slice onto the grid. Clips snap magnetically, carry their own FX patches, and the loop plays the occupied cells back-to-back — rows, columns, snake, spiral or shuffle. Underneath, a granular engine with SCAN, DENSITY, LENGTH and SPRAY.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sec.isRoly }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: rgba(14,20,14,.5); border: 1px solid #3A4433; border-radius: 10px; padding: 18px;\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .24em; color: #8FE8A8; margin-bottom: 12px;\">THE FEELING OF 3 : 4<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 26px;\">\n                <div style=\"position: relative; width: 140px; height: 140px; flex-shrink: 0;\">\n                  <div style=\"position: absolute; inset: 0; border: 1.5px solid #3A4433; border-radius: 50%;\"><\u002Fdiv>\n                  <div style=\"position: absolute; inset: 22px; border: 1.5px solid #3A4433; border-radius: 50%;\"><\u002Fdiv>\n                  <div style=\"position: absolute; inset: 0; animation: scOrbit 4s linear infinite;\"><div style=\"position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #D8C878; box-shadow: 0 0 10px rgba(216,200,120,.8);\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"position: absolute; inset: 22px; animation: scOrbit 3s linear infinite;\"><div style=\"position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #8FE8A8; box-shadow: 0 0 10px rgba(143,232,168,.8);\"><\u002Fdiv><\u002Fdiv>\n ,232,168,.6)' : 'none'), anim: nudged ? 'scTickNudge 4s ease-in-out infinite' : 'none' });\n    }\n    const mirror = (seed, amp) => {\n      const pts = []; for (let x = 0; x <= 700; x += 14) pts.push([x, Math.abs(amp * (0.4 + 0.6 * Math.abs(Math.sin(x / 70 + seed))) * (0.5 + 0.5 * Math.sin(x / 180 + seed * 2)))]);\n      let top = 'M0 25', bot = ''; pts.forEach(p => { top += ' L' + p[0] + ' ' + (25 - p[1]); }); for (let i = pts.length - 1; i >= 0; i--) bot += ' L' + pts[i][0] + ' ' + (25 + pts[i][1]);\n      return top + bot + ' Z';\n    };\n    const fam = ['#DE8A34', '#A3B184', '#4FBFB0', '#5AA7DE'];\n    const chordBlocks = ['Am7', 'Dm9', 'G13', 'Cmaj9'].map((n, i) => ({ n, s: ['HOLD', 'STRUM', 'ARP', 'TRESILLO'][i], x: (2 + i * 24.5) + '%', y: (22 + (i * 31) % 50) + 'px', h: (44 + (i % 2) * 14) + 'px', c: fam[i], bg: fam[i] + '2E', notes: [0, 1, 2, 3, 4, 5, 6, 7].map(k => ({ d: (k * .12 + i * .4) + 's' })) }));\n    let vt = 'M0 67', vb = ''; const vp = []; for (let x = 0; x <= 700; x += 5) vp.push([x, 60 * (.35 + .65 * Math.abs(Math.sin(x / 110 + .6)) * (0.5 + 0.5 * Math.sin(x / 37))) * (0.6 + 0.4 * Math.abs(Math.sin(x * .37)))]);\n    vp.forEach(p => { vt += ' L' + p[0] + ' ' + (67 - p[1]); }); for (let i = vp.length - 1; i >= 0; i--) vb += ' L' + vp[i][0] + ' ' + (67 + vp[i][1]);\n    const vsChops = [3, 16, 29, 45, 60, 78].map((x, i) => ({ x: x + '%', n: String(i + 1).padStart(2, '0'), c: i === 2 ? '#F5EFE4' : ['#FFB25A', '#EDAA55', '#E08A3C'][i % 3] }));\n    const ssCells = [];\n    for (let r = 0; r < 14; r++) for (let c = 0; c < 40; c++) {\n      const t = c / 40; let e = Math.exp(-r / 5) * (0.5 + 0.5 * Math.sin(t * 11 + r * .7)) + 0.12 * Math.abs(Math.sin(r * 1.3 + t * 5));\n      if (r === 3 + Math.round(2 * Math.sin(t * 6))) e += .5; if (r === 7 + Math.round(1.5 * Math.sin(t * 9 + 2))) e += .35;\n      e = Math.min(1, e); let o = t < .3 ? 0 : (t < .55 ? 1 : (t < .78 ? 2 : 3)); if (t > .3 && t < .56 && r > 2 && r < 8) o = 0;\n      const b = [[143, 232, 168], [255, 178, 90], [126, 183, 255], [224, 126, 220]][o];\n      ssCells.push({ c: `rgba(${b[0]},${b[1]},${b[2]},${(0.05 + e * .9).toFixed(2)})` });\n    }\n    const cw = 6.25; const clipWave = (s) => { let d = 'M0 15'; for (let x = 0; x <= 120; x += 4) d += ' L' + x + ' ' + (15 - Math.sin(x * .3 + s) * 10 * Math.sin(x / 120 * Math.PI)).toFixed(1); return d; };\n    const ggClips = [[0, 0, 2], [3, 0, 1], [6, 0, 3], [11, 0, 2], [1, 1, 3], [7, 1, 2], [0, 2, 1], [4, 2, 4], [10, 2, 3], [2, 3, 2], [8, 3, 3], [13, 3, 2]].map((c, i) => ({ x: (c[0] * cw + .3) + '%', y: (c[1] * 34 + 2) + 'px', w: (c[2] * cw - .6) + '%', p: clipWave(i) }));\n    const ggGrains = []; for (let i = 0; i < 12; i++) ggGrains.push({ x: (4 + (i * 71) % 92) + '%', y: (8 + (i * 37) % 84) + '%', d: (1 + (i % 4) * .4) + 's' });\n    const P = [\n      { id: 'chordshaper', name: 'ChordShaper', tag: 'CHORD SHAPING INSTRUMENT', v: 'v1.11.2', key: 'isChord', accent: '#DE8A34', c: '#DE8A34', pat: 'leaf', patC: '#4E6B3C', bg: 'linear-gradient(160deg, #2E3A24, #1E1812)', plate: '105deg, rgba(46,58,36,.35), rgba(30,24,18,.8)', ...frame(1140, 990),\n        blurb: 'A grid where time runs left and pitch runs up. Draw a box and it becomes a chord; hold it and a performance wheel unfolds — strums, arps, tresillos, ragtime. 300 factory progressions, a melody pen, a built-in synth and sampler, and MIDI or audio you drag straight into your session.',\n        feats: [{ h: 'Play styles + note expression', p: 'HOLD, STRUM, ARP, TRESILLO, RAGTIME, PULSE, BROKEN — each with variants. Swing, humanize, gate, accent and strum per chord or for all of them.' }, { h: 'Melody pen', p: 'Draw a line across the grid and it rides the chords underneath — 1 3 5 7 9 2 4 6 choose how.' }, { h: 'Sound engine', p: 'Five waves with unison, filter and ADSR, a chromatic sampler, and a virtual MIDI port named CHORDSHAPER.' }],\n        chips: [{ t: '300 PROGRESSIONS' }, { t: 'DRAG MIDI / AUDIO TO DAW' }, { t: '3 PANEL THEMES' }] },\n      { id: 'videosampler', name: 'VideoSampler', tag: 'VIDEO CHOPPING SAMPLER', v: 'v1.4.0', key: 'isVideo', accent: '#FFB25A', c: '#FFB25A', pat: 'hex', patC: '#5A4A30', bg: 'linear-gradient(200deg, #2A2A2C, #171C14)', plate: '255deg, rgba(42,42,44,.3), rgba(23,28,20,.82)', ...frame(1120, 872),\n        blurb: 'Drop a video in, slice it like a record, play the picture back chopped, repitched and time-stretched. Serato-style hot cues on the number keys, a 16-pad MULTI mode with one clip per pad, and PocketSequencer\\u2019s full 10-FX punch chain to lean on while it rolls.',\n        feats: [{ h: 'SINGLE and MULTI', p: 'One long clip with up to 32 chops, or 16 pads each holding their own video with S/E range handles.' }, { h: 'Picture follows the tape', p: 'Transpose is unwarped by default: pitch up, the video runs faster. Toggle WARP to keep timing and stretch the pitch instead.' }, { h: 'Pop-out viewport', p: 'Throw the picture onto a second display or fullscreen; each clip is decoded once for zero-latency retriggers.' }],\n        chips: [{ t: '32 CHOPS' }, { t: '11 PUNCH FX' }, { t: 'FULLSCREEN OUT' }] },\n      { id: 'harmonicfx', name: 'HarmonicFX', tag: 'SPECTRAL EVEN / ODD HARMONIC CONSOLE', v: 'v1.3.0', key: 'isHfx', accent: '#D8C878', c: '#D8C878', pat: 'leaf', patC: '#5A4A30', bg: 'linear-gradient(160deg, #2E2418, #1E1812)', plate: '105deg, rgba(46,36,24,.3), rgba(30,24,18,.8)', ...frame(1120, 940),\n        blurb: 'One signal in, two signals out. HarmonicFX tracks the pitch, splits the sound into its even and odd harmonics, and gives each half its own effect chain before gluing them back together on the master bus.',\n        feats: [{ h: 'Three chains, 8 slots each', p: 'EVEN, ODD and a MASTER glue chain on the summed signal — 33 modules from convolution to bitcrush.' }, { h: 'Four color-coded mods', p: 'LFOs and step sequencers you drop on any knob in any chain; the ring takes the mod\\u2019s color.' }, { h: 'DICE', p: 'One press builds a whole new split o a HarmonicFX module. Only the masked region is split out, processed and folded back.' }, { h: 'Op-log presets', p: 'Every stroke is logged and replayed: tiny presets, perfect undo, deterministic DICE.' }],\n        chips: [{ t: '4096-PT FFT' }, { t: '18 BRUSHES' }, { t: 'RECT + MAGIC LASSO' }] },\n      { id: 'graingrid', name: 'GrainGrid', tag: 'GRANULAR SLICE SEQUENCER', v: 'v1.1.1', key: 'isGrain', accent: '#BC8CEC', c: '#BC8CEC', pat: 'hex', patC: '#5A3B2B', bg: 'linear-gradient(200deg, #3A2A22, #1E1812)', plate: '255deg, rgba(58,42,34,.3), rgba(30,24,18,.82)', ...frame(1128, 888),\n        blurb: 'Capture audio as it plays, drag slices onto a 16\\u00d74 grid, and let the loop walk the occupied cells — forwards, backwards, snake, spiral or shuffle. Each clip carries its own FX patch from two banks of eight, and a granular engine with four modulators sits underneath.',\n        feats: [{ h: 'Capture strip', p: 'Audio types itself left-to-right. Drag the top half to carry a slice to the grid, the bottom half to resize the range.' }, { h: 'FX rack', p: 'Sixteen effects across two banks — distort, filter, crush, reverb, stutter, reverse, delay, pitch and more — patched per clip.' }, { h: 'Granular or sampler engine', p: 'SCAN, DENSITY, LENGTH, SPRAY, DIR and randomizers, tempo-synced, with a 3-octave keyboard.' }],\n        chips: [{ t: '10 PLAY MODES' }, { t: '16 FX' }, { t: 'FIELD CLAY PLATE' }] },\n      { id: 'rolypoly', name: 'RolyPoly', tag: 'POLYRHYTHMIC SOUND DESIGN ENGINE', v: 'v1.1.1', key: 'isRoly', accent: '#8FE8A8', c: '#C9702F', pat: 'leaf', patC: '#4E6B3C', bg: 'linear-gradient(160deg, #2E3A24, #241B10)', plate: '105deg, rgba(46,58,36,.35), rgba(36,27,16,.75)', ...frame(900, 734),\n        blurb: 'Two samples, two rates. Set A to 3 and B to 4 and they roll against each other \\u2014 phasing, colliding, landing together once a bar. Capture any moment of the collision as a new sample and keep going.',\n        feats: [{ h: 'Five FX blocks', p: 'Distortion, filter, tempo-synced delay, reverb and dynamics, each with its own scope.' }, { h: 'Four modulators', p: 'Sine, square, sample-and-hold or drawn — synced or free, aimed at any knob.' }, { h: 'Capture sampler', p: 'Drag across the live output and the slice loads straight back into A or B.' }],\n        chips: [{ t: 'DUAL SAMPLERS' }, { t: 'RATE 1\\u201316' }, { t: 'CAPTURE STRIP' }] }\n    ];\n    const FREE = ['chordshaper', 'soundsculpt'];\n    const tierOf = (id) => FREE.includes(id)\n      ? { tier: 'FREE ON SPLICE', tierBg: 'rgba(143,232,168,.12)', tierBd: 'rgba(143,232,168,.5)', tierC: '#8FE8A8' }\n      : { tier: 'IN THE $10 BUNDLE', tierBg: 'rgba(216,200,120,.1)', tierBd: 'rgba(216,200,120,.45)', tierC: '#D8C878' };\n    const sections = P.map((p, i) => ({ ...p, ...tierOf(p.id), num: String(i + 1).padStart(2, '0'), patOp: '.3', isChord: false, isVideo: false, isHfx: false, isPocket: false, isSculpt: false, isGrain: false, isRoly: false, [p.key]: true }));\n    const marqueeBase = P.map(p => p.name.toUpperCase() + ' \\u00b7 ' + p.tag).concat(['CHORDSHAPER + SOUNDSCULPT FREE ON SPLICE \\u00b7 FIVE-PLUGIN BUNDLE $10']);\n    return {\n      nav: P.map(p => ({ t: p.name.toUpperCase(), href: '#' + p.id })),\n      marquee: marqueeBase.concat(marqueeBase).map(t => ({ t })),\n      beats3, beats4, pocketTicks, chordBlocks, vsChops, ssCells, ggClips, ggGrains,\n      vsWave: vt + vb + ' Z',\n      splitE: mirror(0, 19), splitO: mirror(2.1, 13),\n      vuMinis: [{ label: 'EVEN', c: '#6FBF8A', lc: '#3E8B5C', anim: 'scNeedleE' }, { label: 'ODD', c: '#E08A3C', lc: '#B5622A', anim: 'scNeedleO' }],\n      sections,\n      bundleHref: 'https://outsideaudio.gumroad.com/l/bundle',\n      freeCards: P.filter(p => FREE.includes(p.id)).map(p => ({ name: p.name, v: p.v + ' \\u00b7 VST3 + AU', c: p.c, note: p.tag.toLowerCase(), href: 'https://splice.com/plugins/outside-audio-' + p.id })),\n      paidCards: P.filter(p => !FREE.includes(p.id)).map(p => ({ name: p.name, v: p.v, c: p.c, note: p.tag.toLowerCase() }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
